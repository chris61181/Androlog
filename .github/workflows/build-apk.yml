name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bundle Web App into Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          find . -maxdepth 1 -name "*.json" -exec cp {} www/ \; || true
          find . -maxdepth 1 -name "*.js" -exec cp {} www/ \; || true
          find . -maxdepth 1 -name "*.png" -exec cp {} www/ \; || true

          # Auto-increment version string using GitHub Actions run number
          BUILD_NUM="${{ github.run_number }}"
          VERSION_STR="2.4.${BUILD_NUM}"
          sed -i "s/2\.4\.0/${VERSION_STR}/g" www/index.html || true
          sed -i "s/2\.4\.0/${VERSION_STR}/g" www/sw.js || true

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.coyle.androlog",
            "appName": "AndroLog",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost"
            }
          }
          EOF
          npx cap add android

          # Update Android native versionCode and versionName in build.gradle
          sed -i "s/versionCode 1/versionCode ${BUILD_NUM}/g" android/app/build.gradle || true
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_STR}\"/g" android/app/build.gradle || true

          # Patch MainActivity.java to support Google OAuth popups and strip '; wv' from User-Agent
          cat << 'EOF' > android/app/src/main/java/com/coyle/androlog/MainActivity.java
          package com.coyle.androlog;

          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private Dialog authDialog;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null) {
                          WebView webView = this.bridge.getWebView();
                          if (webView != null) {
                              WebSettings settings = webView.getSettings();
                              settings.setJavaScriptEnabled(true);
                              settings.setSupportMultipleWindows(true);
                              settings.setJavaScriptCanOpenWindowsAutomatically(true);
                              settings.setDomStorageEnabled(true);
                              settings.setDatabaseEnabled(true);

                              // Enable cookies & third-party cookies across localhost and firebaseapp.com
                              CookieManager cookieManager = CookieManager.getInstance();
                              cookieManager.setAcceptCookie(true);
                              cookieManager.setAcceptThirdPartyCookies(webView, true);

                              // Clean User Agent to avoid Google's "403 disallowed_useragent"
                              String ua = settings.getUserAgentString();
                              if (ua != null && ua.contains("; wv")) {
                                  settings.setUserAgentString(ua.replace("; wv", ""));
                              }

                              // Handle OAuth popups seamlessly inside an overlay Dialog
                              webView.setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                                  @Override
                                  public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                                      try {
                                          WebView popupWebView = new WebView(MainActivity.this);
                                          WebSettings popupSettings = popupWebView.getSettings();
                                          popupSettings.setJavaScriptEnabled(true);
                                          popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                                          popupSettings.setDomStorageEnabled(true);
                                          popupSettings.setDatabaseEnabled(true);
                                          popupSettings.setSupportMultipleWindows(true);

                                          String popupUa = popupSettings.getUserAgentString();
                                          if (popupUa != null && popupUa.contains("; wv")) {
                                              popupSettings.setUserAgentString(popupUa.replace("; wv", ""));
                                          }

                                          CookieManager.getInstance().setAcceptCookie(true);
                                          CookieManager.getInstance().setAcceptThirdPartyCookies(popupWebView, true);

                                          authDialog = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                                          authDialog.setContentView(popupWebView);
                                          if (authDialog.getWindow() != null) {
                                              authDialog.getWindow().setLayout(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                                          }
                                          authDialog.show();

                                          popupWebView.setWebChromeClient(new WebChromeClient() {
                                              @Override
                                              public void onCloseWindow(WebView window) {
                                                  try {
                                                      if (authDialog != null && authDialog.isShowing()) {
                                                          authDialog.dismiss();
                                                      }
                                                  } catch (Exception ignored) {}
                                              }
                                          });

                                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                                          transport.setWebView(popupWebView);
                                          resultMsg.sendToTarget();
                                          return true;
                                      } catch (Exception e) {
                                          return false;
                                      }
                                  }
                              });
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          npx cap sync android

      - name: Compile Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AndroLog.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroLog-APK-v2.4.${{ github.run_number }}
          path: AndroLog.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AndroLog v2.4.${{ github.run_number }} (Build #${{ github.run_number }})"
          body: "Automated Android APK build #${{ github.run_number }} compiled from commit ${{ github.sha }}."
          files: AndroLog.apk
          prerelease: false
