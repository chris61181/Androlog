name: Build Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bundle Web App into Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          find . -maxdepth 1 -name "*.json" -exec cp {} www/ \; || true
          find . -maxdepth 1 -name "*.js" -exec cp {} www/ \; || true
          find . -maxdepth 1 -name "*.png" -exec cp {} www/ \; || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.coyle.androlog",
            "appName": "AndroLog",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AndroLog.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroLog-APK
          path: AndroLog.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AndroLog Latest APK"
          files: AndroLog.apk
          prerelease: false
